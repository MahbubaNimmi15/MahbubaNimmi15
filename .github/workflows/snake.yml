name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: MahbubaNimmi15
          outputs: |
            dist/github-contribution-snake.gif?color_snake=%23A855F7&color_dots=%23161B22,%23312E4A,%235B21B6,%23C026D3,%23EC4899&color_background=%230B1020
            dist/github-contribution-snake.svg?color_snake=%23A855F7&color_dots=%23161B22,%23312E4A,%235B21B6,%23C026D3,%23EC4899
            dist/github-contribution-snake-dark.svg?palette=github-dark&color_snake=%23C084FC&color_dots=%230D1117,%232E1065,%237E22CE,%23C026D3,%23F472B6

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
